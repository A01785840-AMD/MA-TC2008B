[build-system]
requires = ["setuptools>=80.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magent_backend"
version = "0.0.1"
description = "Agent"
readme = "README.md"
requires-python = ">=3.13"

authors = [
    { name = "Me", email = "me@domain.com" }
]

dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ['src']